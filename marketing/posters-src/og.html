<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>og image</title>
<style>
  html, body { margin: 0; }
  .card { width: 1200px; height: 630px; box-sizing: border-box; padding: 64px 72px; position: relative; overflow: hidden;
    background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 55%, #1f6feb 100%); color: #fff; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; display: flex; flex-direction: column; justify-content: space-between; }
  .tag { display: inline-block; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3); border-radius: 999px; padding: 8px 18px; font-size: 22px; align-self: flex-start; }
  h1 { font-size: 72px; line-height: 1.15; margin: 0; font-weight: 800; }
  .sub { font-size: 30px; opacity: .92; margin: 0; }
  .foot { display: flex; justify-content: space-between; align-items: flex-end; }
  .url { font-size: 34px; font-weight: 700; }
  .brand { font-size: 22px; opacity: .8; }
  .bubble { position: absolute; right: 72px; top: 150px; background: #fff; color: #16181d; border-radius: 20px 20px 20px 4px; padding: 18px 22px; font-size: 22px; max-width: 380px; line-height: 1.45; box-shadow: 0 16px 40px rgba(0,0,0,.25); }
  .bubble.me { top: 60px; right: 72px; background: #e8f0fe; color: #1f2d5a; border-radius: 20px 20px 4px 20px; max-width: 320px; }
</style>
</head>
<body>
<div class="card">
  <span class="tag">AI 接待助理 · AI Receptionist</span>
  <div>
    <h1>给你的网站<br/>请一个不睡觉的前台</h1>
    <p class="sub">24 小时回答、收集线索、自动预约、转人工通知。中英文。</p>
  </div>
  <div class="foot">
    <div><div class="url">www.the5288.com</div><div class="brand">LuckyYou Studio</div></div>
  </div>
  <div class="bubble me">做个 AI 客服大概多少钱？</div>
  <div class="bubble">通常 CAD $1,500 – $4,000，1 – 2 周上线。方便说说你的业务和想解决的问题吗？</div>
</div>
</body>
</html>
